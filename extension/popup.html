<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADHD Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      background: #fff;
      color: #111;
    }
    h1 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      color: #111;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    .error { color: #dc2626; font-size: 11px; margin-top: 3px; min-height: 14px; display: block; }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #1d4ed8; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>ADHD Agent</h1>
  <div class="field">
    <label for="userEmail">Your Email</label>
    <input type="email" id="userEmail" placeholder="you@example.com">
    <span class="error" id="userEmailError"></span>
  </div>
  <div class="field">
    <label for="supervisorEmail">Supervisor Email</label>
    <input type="email" id="supervisorEmail" placeholder="supervisor@example.com">
    <span class="error" id="supervisorEmailError"></span>
  </div>
  <button id="saveBtn">Save</button>
  <div id="status"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
